version: 1

project:
  root: .
  build_config: lzc-build.yml
  package_file: package.yml
  output: .lazycat-build/nodepassdash.lpk
  target_arch: amd64

update:
  strategy: publish
  allow_downgrade: false
  version_source:
    type: image
    image: nodepassdash

build:
  run_buildscript: false

images:
  - id: nodepassdash
    target: service
    service: nodepassdash
    source: ghcr.io/nodepassproject/nodepassdash
    channel: stable
    sort: semver
    tag_regex: '^\d+\.\d+\.\d+$'
    delivery:
      mode: lazycat

stores:
  official:
    enabled: true
    skip_if_version_exists: true
    changelog_locales: [zh, en]
  private:
    enabled: true
    skip_if_version_exists: true
    name: NodePassDash
    summary: 一个现代化的NodePass管理界面
